<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashley - Profile</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <main class="hero-section">
        <div class="hero-content">
            <div class="quadrant top-left">
                <div class="profile-image">
                    <div class="image-container">
                        <img src="8.jpg" alt="Ashley Profile" />
                        <div class="image-overlay"></div>
                    </div>
                </div>
            </div>

            <div class="quadrant top-right">
                <a class="media-card-link" href="https://drive.google.com/drive/folders/138g5j5-o7q4CcOSzuBkuoQazjX0lpEJY?usp=drive_link" target="_blank" rel="noreferrer">
                    <div class="media-card photo-card">
                        <img src="Photos.jpg" alt="Photos" />
                        <div class="media-overlay">
                            <span>Photos</span>
                        </div>
                    </div>
                </a>
            </div>
            
            <div class="quadrant bottom-left">
                <div class="profile-info-box">
                    <div class="box-content">
                        <h3>Hi! I'm ur cutie pie Ashley.</h3>
                        <p>Welcome to my page. Thanks for visiting and keeping me alive through this webpage. Miss u guys.</p>
                    </div>
                </div>
            </div>

            <div class="quadrant bottom-right">
                <a class="media-card-link" href="https://drive.google.com/drive/folders/1MgL097nnggi_f1YLOMBslM0x90u7KwWk?usp=sharing" target="_blank" rel="noreferrer">
                    <div class="media-card video-card">
                        <img src="Videos.jpg" alt="Videos" />
                        <div class="media-overlay">
                            <span>Videos</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
